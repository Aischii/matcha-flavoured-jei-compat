plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
}

version = "1.0.0"
group = "com.matcha"

base {
    archivesName = "matcha-flavoured-jei-compat"
}

repositories {
    maven { url = "https://maven.blamejared.com" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.2"

    compileOnly "mezz.jei:jei-26.2-common-api:30.14.0.89"
    compileOnly "mezz.jei:jei-26.2-fabric-api:30.14.0.89"
    runtimeOnly "mezz.jei:jei-26.2-fabric:30.14.0.89"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
