plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.4'
}

version = "1.1.2"
group = "com.matcha"

base {
    archivesName = "matcha-flavoured-jei-compat"
}

repositories {
    maven { url = "https://maven.blamejared.com" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.20.1"
    implementation "net.fabricmc.fabric-api:fabric-api:0.166.2+26.3"

    compileOnly "mezz.jei:jei-26.3-common-api:31.18.0.118"
    compileOnly "mezz.jei:jei-26.3-fabric-api:31.18.0.118"
    runtimeOnly "mezz.jei:jei-26.3-fabric:31.18.0.118"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
